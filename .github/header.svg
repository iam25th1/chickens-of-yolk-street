<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Chickens of Yolk Street: one live egg market of players and AI farms" shape-rendering="crispEdges">
  <!-- sky, sun and drifting clouds -->
  <rect width="1200" height="300" fill="#5aa7d8"/>
  <g fill="#f2c94c">
    <rect x="1020" y="40" width="48" height="48"/>
    <rect x="1012" y="48" width="64" height="32"/>
    <rect x="1028" y="32" width="32" height="64"/>
  </g>
  <g fill="#f6e7c1">
    <g>
      <animateTransform attributeName="transform" type="translate" from="-260 0" to="1260 0" dur="38s" repeatCount="indefinite"/>
      <rect x="0" y="52" width="96" height="16"/><rect x="16" y="36" width="56" height="16"/><rect x="24" y="68" width="88" height="8"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="-600 0" to="900 0" dur="52s" repeatCount="indefinite"/>
      <rect x="0" y="96" width="72" height="12"/><rect x="12" y="84" width="40" height="12"/>
    </g>
  </g>

  <!-- title -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="900">
    <text x="52" y="86" font-size="58" fill="#2a160c">CHICKENS OF YOLK STREET</text>
    <text x="48" y="82" font-size="58" fill="#b8321f">CHICKENS OF YOLK STREET</text>
    <text x="50" y="122" font-size="22" fill="#2a160c">one live egg market | farms run by players and AI | AI suppliers and buyers | NEAR</text>
  </g>

  <!-- market multiplier line: drawn by trades, never by script -->
  <g transform="translate(860 120)">
    <rect x="0" y="0" width="300" height="76" fill="#2a160c"/>
    <rect x="4" y="4" width="292" height="68" fill="#3a2414"/>
    <polyline points="10,58 40,50 70,54 100,30 130,24 160,40 190,62 220,66 250,46 280,36" fill="none" stroke="#f2c94c" stroke-width="4" stroke-dasharray="420" stroke-dashoffset="420">
      <animate attributeName="stroke-dashoffset" values="420;0;0;420" keyTimes="0;0.5;0.85;1" dur="6s" repeatCount="indefinite"/>
    </polyline>
    <text x="10" y="18" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#f6e7c1">MARKET x(600/S)^0.8</text>
  </g>

  <!-- ground -->
  <rect x="0" y="206" width="1200" height="94" fill="#5c9e3a"/>
  <rect x="0" y="222" width="1200" height="50" fill="#f2c94c"/>
  <g fill="#d9a63a">
    <rect x="30" y="232" width="16" height="4"/><rect x="190" y="252" width="12" height="4"/><rect x="420" y="238" width="16" height="4"/>
    <rect x="610" y="256" width="12" height="4"/><rect x="820" y="236" width="16" height="4"/><rect x="1010" y="250" width="12" height="4"/>
  </g>

  <!-- hens: a waddling flock (body, comb, beak, eye, legs) -->
  <defs>
    <g id="hen">
      <rect x="0" y="8" width="28" height="20" fill="#2a160c"/>
      <rect x="2" y="10" width="24" height="16" fill="#f6e7c1"/>
      <rect x="18" y="0" width="12" height="12" fill="#2a160c"/>
      <rect x="20" y="2" width="8" height="8" fill="#f6e7c1"/>
      <rect x="20" y="-4" width="8" height="4" fill="#b8321f"/>
      <rect x="30" y="4" width="6" height="4" fill="#f2c94c"/>
      <rect x="24" y="4" width="2" height="2" fill="#2a160c"/>
      <rect x="8" y="28" width="4" height="6" fill="#c8693f"/>
      <rect x="18" y="28" width="4" height="6" fill="#c8693f"/>
    </g>
  </defs>
  <g>
    <animateTransform attributeName="transform" type="translate" from="-160 0" to="1300 0" dur="16s" repeatCount="indefinite"/>
    <g transform="translate(0 196)"><use href="#hen"><animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="0.4s" repeatCount="indefinite"/></use></g>
    <g transform="translate(-70 204)"><use href="#hen"><animateTransform attributeName="transform" type="translate" values="0 -3;0 0;0 -3" dur="0.4s" repeatCount="indefinite"/></use></g>
    <g transform="translate(-140 198)"><use href="#hen"><animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="0.4s" repeatCount="indefinite"/></use></g>
  </g>

  <!-- an egg drops with squash and stretch, again and again -->
  <g transform="translate(560 0)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 150;0 150;0 232;0 226;0 232;0 232" keyTimes="0;0.2;0.42;0.5;0.58;1" dur="2.4s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="scale" values="1 1;1 1;1.3 0.7;0.9 1.15;1 1;1 1" keyTimes="0;0.2;0.42;0.5;0.58;1" dur="2.4s" repeatCount="indefinite"/>
        <rect x="-10" y="-26" width="20" height="26" fill="#2a160c"/>
        <rect x="-8" y="-24" width="16" height="22" fill="#fff8e4"/>
        <rect x="-5" y="-21" width="3" height="5" fill="#ffffff"/>
      </g>
    </g>
  </g>

  <!-- ticker -->
  <rect x="0" y="272" width="1200" height="28" fill="#2a160c"/>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#f2c94c">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="20s" repeatCount="indefinite"/>
      <text x="10" y="291">WHITE 1.00   CREAM 1.20   BROWN 1.50   GOLDEN 6.00   MARKET x1.00   UPSTART EGGS   OLD MONEY FARMS   DAY CLOSES EVERY 3 MIN</text>
      <text x="1210" y="291">WHITE 1.00   CREAM 1.20   BROWN 1.50   GOLDEN 6.00   MARKET x1.00   UPSTART EGGS   OLD MONEY FARMS   DAY CLOSES EVERY 3 MIN</text>
    </g>
  </g>
</svg>

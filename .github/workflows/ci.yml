name: ci

on:
  push:
    branches: [main, 'build/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.3
          cache: npm
      # Lockfile install with no install scripts, the same way the README asks people to install.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      # The runner ships PostgreSQL 16 (server and client tools). A throwaway local database and
      # user, for this job only: the password below guards nothing outside this runner.
      - name: Start PostgreSQL for the Postgres tests, the production boot and the backup round trip
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE USER coys WITH PASSWORD 'ci-only' CREATEDB"
          for db in coys_test coys coys_restore; do sudo -u postgres createdb -O coys "$db"; done
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://coys:ci-only@localhost:5432/coys_test
      - run: npm run build
      - name: Production build boots against Postgres and answers /healthz
        env:
          NODE_ENV: production
          PORT: '8787'
          DATABASE_URL: postgres://coys:ci-only@localhost:5432/coys
          GAME_SEASON: ci
          SESSION_SECRET: ci-only-session-secret-for-this-job
        run: |
          node apps/server/dist/main.js > server.log 2>&1 &
          pid=$!
          for i in $(seq 1 30); do curl -sf http://localhost:8787/healthz > healthz.json && break; sleep 1; done
          cat healthz.json; echo
          node -e "const h=require('./healthz.json'); if (!h.ok || h.season !== 'ci' || h.db.kind !== 'postgres' || !h.commit) process.exit(1)"
          curl -sf http://localhost:8787/ | grep -q '<div id="root">'
          kill $pid
          cat server.log
      - name: Back up the production database and restore it into another
        env:
          DATABASE_URL: postgres://coys:ci-only@localhost:5432/coys
          RESTORE_DATABASE_URL: postgres://coys:ci-only@localhost:5432/coys_restore
        run: |
          npx tsx scripts/db-backup.ts --out backups
          npx tsx scripts/db-restore.ts --file "$(ls backups/*.dump)" --url-env RESTORE_DATABASE_URL --yes
          test "$(PGPASSWORD=ci-only psql -h localhost -U coys -d coys_restore -tAc 'SELECT season FROM game_clock')" = ci

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/coys-game/target
            contracts/sandbox-tests/target
          key: cargo-${{ hashFiles('contracts/*/Cargo.lock', 'contracts/*/rust-toolchain.toml') }}
      - name: Install cargo-near 0.23.0 (checksum verified)
        run: |
          base=https://github.com/near/cargo-near/releases/download/cargo-near-v0.23.0
          f=cargo-near-x86_64-unknown-linux-gnu.tar.gz
          curl -sSfL -o "$f" "$base/$f"
          curl -sSfL -o "$f.sha256" "$base/$f.sha256"
          echo "$(cut -d' ' -f1 "$f.sha256")  $f" | sha256sum -c
          mkdir -p cn && tar -xzf "$f" -C cn
          find cn -name cargo-near -type f -exec install -m 755 {} "$HOME/.cargo/bin/" \;
          cargo near --version
      - name: Contract unit tests
        working-directory: contracts/coys-game
        run: cargo test --locked
      - name: Build the contract (cargo near)
        working-directory: contracts/coys-game
        run: cargo near build non-reproducible-wasm --locked
      - name: Sandbox tests (Feathers and the 777 cap, compact settlement, the version 2 upgrade and release, provenance, access control)
        working-directory: contracts/sandbox-tests
        env:
          COYS_WASM: ${{ github.workspace }}/contracts/coys-game/target/near/coys_game.wasm
        run: cargo test --locked -- --test-threads=1 --nocapture
      - name: Contract size
        run: wc -c contracts/coys-game/target/near/coys_game.wasm
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: coys-game-wasm
          path: contracts/coys-game/target/near/coys_game.wasm
          if-no-files-found: error

name: ci

on:
  push:
    branches: [main, 'build/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.3
          cache: npm
      # Lockfile install with no install scripts, the same way the README asks people to install.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      # The runner ships PostgreSQL 16 (server and client tools). A throwaway local database and
      # user, for this job only: the password below guards nothing outside this runner.
      - name: Start PostgreSQL for the Postgres tests, the production boot and the backup round trip
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE USER coys WITH PASSWORD 'ci-only' CREATEDB"
          for db in coys_test coys coys_restore; do sudo -u postgres createdb -O coys "$db"; done
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://coys:ci-only@localhost:5432/coys_test
      - run: npm run build
      - name: Production build boots against Postgres and answers /healthz
        env:
          NODE_ENV: production
          PORT: '8787'
          DATABASE_URL: postgres://coys:ci-only@localhost:5432/coys
          GAME_SEASON: ci
          SESSION_SECRET: ci-only-session-secret-for-this-job
        run: |
          node apps/server/dist/main.js > server.log 2>&1 &
          pid=$!
          for i in $(seq 1 30); do curl -sf http://localhost:8787/healthz > healthz.json && break; sleep 1; done
          cat healthz.json; echo
          node -e "const h=require('./healthz.json'); if (!h.ok || h.season !== 'ci' || h.db.kind !== 'postgres' || !h.commit) process.exit(1)"
          curl -sf http://localhost:8787/ | grep -q '<div id="root">'
          kill $pid
          cat server.log
      - name: Back up the production database and restore it into another
        env:
          DATABASE_URL: postgres://coys:ci-only@localhost:5432/coys
          RESTORE_DATABASE_URL: postgres://coys:ci-only@localhost:5432/coys_restore
        run: |
          npx tsx scripts/db-backup.ts --out backups
          npx tsx scripts/db-restore.ts --file "$(ls backups/*.dump)" --url-env RESTORE_DATABASE_URL --yes
          test "$(PGPASSWORD=ci-only psql -h localhost -U coys -d coys_restore -tAc 'SELECT season FROM game_clock')" = ci

name: layout

# The browser checks: pull requests only, and not for changes to docs alone.
on:
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', '**/*.png', '**/*.mp4', '**/*.webm']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The browser checks (e2e/) at three window sizes, 1280x720, 1920x1080 and 390x844: no scrollbars
  # and nothing cut off on every screen, tab, page and tour step, the tour, the Market, the profile,
  # hatching, the mint and the top bar, in the built game in a headless browser (the runner's own
  # Chrome, a fresh profile each time). Nothing is downloaded for it. The full sweep (every size)
  # stays a local run before merging: npm run test:e2e.
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.3
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Every screen fits at three window sizes
        env:
          CHROME_PATH: /usr/bin/google-chrome
          E2E_PROGRESS: '1'
          E2E_SIZES: 1280x720,1920x1080,390x844
        run: npm run test:e2e

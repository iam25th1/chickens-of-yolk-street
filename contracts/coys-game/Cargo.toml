[package]
name = "coys-game"
description = "Chickens of Yolk Street game contract: hen NFTs (NEP-171), egg tokens (NEP-245) and the daily settlement"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
repository = "https://github.com/iam25th1/chickens-of-yolk-street"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.1"
near-contract-standards = "=5.30.1"
near-sdk-contract-tools = { version = "=4.0.0", features = ["unstable"] }

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.23.0-rust-1.99.1"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]
